name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true
      release_name:
        description: "Release name"
        required: false

permissions:
  contents: write

jobs:
  build-addon:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ankiplugin

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
          path: ankiplugin

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m py_compile __init__.py exam_window.py history_store.py launcher.py preset_store.py scorer.py package_addon.py

      - name: Build add-on package
        run: python package_addon.py

      - name: Upload add-on artifact
        uses: actions/upload-artifact@v4
        with:
          name: exam_simulator
          path: ankiplugin/dist/exam_simulator.ankiaddon
          if-no-files-found: error

  publish-release:
    needs: build-addon
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.release_name || github.event.inputs.tag || github.ref_name }}
          files: release-assets/exam_simulator/exam_simulator.ankiaddon
